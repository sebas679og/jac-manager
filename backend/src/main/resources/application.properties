spring.application.name=jac-manager-api
server.port=8080
spring.config.import=optional:file:.env[.properties]
management.endpoints.web.exposure.include=health

# Datasource Configuration
spring.datasource.url=${JAC_MANAGER_API_DATASOURCE_URL}
spring.datasource.username=${JAC_MANAGER_API_DATASOURCE_USERNAME}
spring.datasource.password=${JAC_MANAGER_API_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${JAC_MANAGER_API_JPA_DDL:validate}
spring.jpa.show-sql=${JAC_MANAGER_API_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false