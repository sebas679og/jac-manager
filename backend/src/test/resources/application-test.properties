# Application Configuration for Swiss Route API
spring.application.name=jac-manager-api
server.port=8080
logging.level.org.springframework=WARN
logging.level.root=WARN
logging.level.com.group4=DEBUG
spring.mvc.format.enum=to_lower_case

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC